name: Daily Swasthika Backup

on:
  schedule:
    - cron: '55 20 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Set up rclone config
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Dump database
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.SUPABASE_DB_URL_SWASTHIKA }}" \
            --no-owner --no-privileges \
            --schema=public \
            -f backup.sql
          gzip backup.sql

      - name: Rename with date
        run: mv backup.sql.gz "swasthika_backup_$(date +%F).sql.gz"

      - name: Upload to Google Drive
        run: |
          rclone copy swasthika_backup_*.sql.gz backupdrive:supabase-backups/swasthika/

      - name: Clean up old backups (older than 14 days)
        run: |
          rclone delete backupdrive:supabase-backups/swasthika/ --min-age 14d
